<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Jornada da Clara & Olívia</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* Modal de Memória Estilo Cartoon / Cozy */
        #memory-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 420px;
            background: rgba(24, 20, 38, 0.95);
            border: 4px solid #f59e0b;
            border-radius: 24px;
            padding: 24px;
            color: #ffffff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(245, 158, 11, 0.2);
            text-align: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
        #memory-modal h2 { color: #fbbf24; margin-top: 0; font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #memory-modal p { font-size: 15px; line-height: 1.6; color: #e2e8f0; margin: 15px 0 20px 0; }
        #memory-modal button {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff; font-weight: bold; font-size: 16px;
            border: none; padding: 12px 28px; border-radius: 30px; cursor: pointer;
            box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s;
        }
        #memory-modal button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="memory-modal">
        <h2 id="modal-title">Título</h2>
        <p id="modal-desc">Descrição da lembrança...</p>
        <button onclick="closeModal()">Guardar no Álbum ✨</button>
    </div>

    <script>
        const config = {
            type: Phaser.AUTO,
            scale: { mode: Phaser.Scale.RESIZE, parent: 'game-container', width: '100%', height: '100%' },
            backgroundColor: '#34d399',
            physics: { default: 'arcade', arcade: { debug: false } },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let player, playerBodyGraphics, cursors, actionBtn;
        let isPointerDown = false, pointerOrigin = { x: 0, y: 0 }, moveVector = { x: 0, y: 0 };
        let activeLocation = null;
        let walkTimer = 0;

        const LOCATIONS = [
            {
                x: 500, y: 1100,
                title: "🌸 O Jardim da Clara",
                desc: "Um canteiro cheio de vida e cores preparadas especialmente para receber a chegada da irmãzinha Olívia!"
            },
            {
                x: 1500, y: 1100,
                title: "🏸 O Baú do Tio Júlio",
                desc: "Você encontrou o baú de aventuras da família com raquetes de Beach Tennis e segredos para o próximo encontro!"
            },
            {
                x: 1000, y: 400,
                title: "⭐ A Estrelinha na Janela",
                desc: "A Estrelinha brilha no céu indicando que o amor da família já está completo e aguardando a Olívia!"
            }
        ];

        function preload() {}

        function create() {
            const scene = this;
            const WORLD_SIZE = 2000;

            scene.physics.world.setBounds(0, 0, WORLD_SIZE, WORLD_SIZE);

            // --- 1. GERAÇÃO DE TEXTURAS VETORIAIS (ESTILO SWORDS OF DITTO) ---
            generateVectorAssets(scene);

            // --- 2. CONSTRUÇÃO DO CENÁRIO ---
            // Gramado de Fundo
            scene.add.tileSprite(WORLD_SIZE/2, WORLD_SIZE/2, WORLD_SIZE, WORLD_SIZE, 'grass_tile');

            // Caminho Sinuoso de Pedras
            let path = scene.add.graphics();
            path.lineStyle(110, 0xe2e8f0, 1);
            path.beginPath();
            path.moveTo(500, 1100);
            path.lineTo(1000, 1100);
            path.lineTo(1000, 400);
            path.lineTo(1500, 1100);
            path.strokePath();

            // Detalhes do Caminho
            path.lineStyle(90, 0xcbd5e1, 1);
            path.strokePath();

            // Elementos Decorativos Espalhados (Flores e Pedras)
            for (let i = 0; i < 200; i++) {
                let rx = Phaser.Math.Between(50, WORLD_SIZE - 50);
                let ry = Phaser.Math.Between(50, WORLD_SIZE - 50);
                if (Phaser.Math.Distance.Between(rx, ry, 1000, 1000) > 100) {
                    let flowerType = Phaser.Math.Between(1, 3);
                    scene.add.image(rx, ry, 'flower_' + flowerType).setScale(0.8);
                }
            }

            // Árvores Estilizadas (Com Sombras)
            for (let i = 0; i < 45; i++) {
                let tx = Phaser.Math.Between(100, WORLD_SIZE - 100);
                let ty = Phaser.Math.Between(100, WORLD_SIZE - 100);

                // Evitar criar árvores bem no meio dos caminhos principais
                if (Math.abs(tx - 1000) > 120 || ty > 1200 || ty < 300) {
                    let shadow = scene.add.ellipse(tx + 15, ty + 25, 90, 45, 0x0f172a, 0.25);
                    let tree = scene.add.image(tx, ty, 'vector_tree').setScale(1.1);
                    tree.setDepth(ty);
                }
            }

            // --- 3. PONTOS DE INTERESSE (MARCADORES ILUMINADOS) ---
            LOCATIONS.forEach(loc => {
                let shadow = scene.add.ellipse(loc.x, loc.y + 10, 80, 30, 0x000000, 0.3);
                let zone = scene.add.circle(loc.x, loc.y, 35, 0xf59e0b, 0.6);
                let ring = scene.add.circle(loc.x, loc.y, 45).setStrokeStyle(3, 0xfef08a);
                
                scene.add.text(loc.x, loc.y - 65, loc.title, { 
                    font: 'bold 15px Arial', fill: '#ffffff', 
                    backgroundColor: '#1e1b4bee', padding: {x:10, y:6} 
                }).setOrigin(0.5).setDepth(2001);

                scene.tweens.add({ targets: [zone, ring], scale: { from: 0.9, to: 1.15 }, alpha: { from: 0.4, to: 0.9 }, duration: 900, yoyo: true, repeat: -1 });
            });

            // --- 4. PERSONAGEM PRINCIPAL (CLARA) ---
            player = scene.add.container(1000, 1100);
            
            let pShadow = scene.add.ellipse(0, 18, 36, 14, 0x000000, 0.3);
            playerBodyGraphics = scene.add.image(0, 0, 'character_sprite');
            
            player.add([pShadow, playerBodyGraphics]);
            scene.physics.world.enable(player);
            player.body.setCollideWorldBounds(true);
            player.body.setSize(40, 40);
            player.body.setOffset(-20, -20);

            // --- 5. CÂMERA DE ACOMPANHAMENTO FLUIDA ---
            scene.cameras.main.setBounds(0, 0, WORLD_SIZE, WORLD_SIZE);
            scene.cameras.main.startFollow(player, true, 0.08, 0.08);

            // --- 6. CONTROLES E BOTÃO DE INTERAÇÃO ---
            actionBtn = scene.add.container(scene.cameras.main.width - 80, scene.cameras.main.height - 80).setScrollFactor(0);
            let btnBg = scene.add.circle(0, 0, 38, 0xf59e0b).setInteractive();
            let btnRing = scene.add.circle(0, 0, 44).setStrokeStyle(3, 0xffffff);
            let btnText = scene.add.text(0, 0, '🔍', { fontSize: '30px' }).setOrigin(0.5);
            actionBtn.add([btnBg, btnRing, btnText]);
            actionBtn.setVisible(false).setDepth(3000);

            btnBg.on('pointerdown', () => {
                if (activeLocation) openModal(activeLocation);
            });

            cursors = scene.input.keyboard.addKeys({
                up: Phaser.Input.Keyboard.KeyCodes.W, down: Phaser.Input.Keyboard.KeyCodes.S,
                left: Phaser.Input.Keyboard.KeyCodes.A, right: Phaser.Input.Keyboard.KeyCodes.D,
                upArrow: Phaser.Input.Keyboard.KeyCodes.UP, downArrow: Phaser.Input.Keyboard.KeyCodes.DOWN,
                leftArrow: Phaser.Input.Keyboard.KeyCodes.LEFT, rightArrow: Phaser.Input.Keyboard.KeyCodes.RIGHT
            });

            // Joystick Touch / Mouse 360 Graus
            scene.input.on('pointerdown', (p) => {
                if (document.getElementById('memory-modal').style.display !== 'block') {
                    isPointerDown = true;
                    pointerOrigin = { x: p.x, y: p.y };
                }
            });
            scene.input.on('pointermove', (p) => {
                if (isPointerDown) {
                    let d = Phaser.Math.Distance.Between(pointerOrigin.x, pointerOrigin.y, p.x, p.y);
                    let a = Phaser.Math.Angle.Between(pointerOrigin.x, pointerOrigin.y, p.x, p.y);
                    let intensity = Math.min(d / 50, 1);
                    moveVector = { x: Math.cos(a) * intensity, y: Math.sin(a) * intensity };
                }
            });
            scene.input.on('pointerup', () => { isPointerDown = false; moveVector = { x: 0, y: 0 }; });
        }

        function update() {
            player.setDepth(player.y);
            const speed = 220;
            let vx = 0;
            let vy = 0;

            let isModalOpen = document.getElementById('memory-modal').style.display === 'block';

            if (!isModalOpen) {
                // Teclado (Combinação para 360°)
                if (cursors.left.isDown || cursors.leftArrow.isDown) vx -= 1;
                if (cursors.right.isDown || cursors.rightArrow.isDown) vx += 1;
                if (cursors.up.isDown || cursors.upArrow.isDown) vy -= 1;
                if (cursors.down.isDown || cursors.downArrow.isDown) vy += 1;

                if (vx !== 0 && vy !== 0) {
                    vx *= 0.7071;
                    vy *= 0.7071;
                }

                // Touch / Mouse Overwrite
                if (isPointerDown) {
                    vx = moveVector.x;
                    vy = moveVector.y;
                }

                player.body.setVelocity(vx * speed, vy * speed);

                // Animação de caminhada 360° (Rotação + Balanço)
                if (vx !== 0 || vy !== 0) {
                    walkTimer += 0.25;
                    let angle = Math.atan2(vy, vx);
                    playerBodyGraphics.setRotation(angle + Math.PI/2);
                    playerBodyGraphics.setScale(1 + Math.sin(walkTimer) * 0.08, 1 - Math.sin(walkTimer) * 0.08);
                } else {
                    playerBodyGraphics.setRotation(0);
                    playerBodyGraphics.setScale(1, 1);
                }
            } else {
                player.body.setVelocity(0, 0);
            }

            // Proximidade dos Pontos de Interesse
            let near = false;
            LOCATIONS.forEach(loc => {
                let dist = Phaser.Math.Distance.Between(player.x, player.y, loc.x, loc.y);
                if (dist < 70) {
                    near = true;
                    activeLocation = loc;
                }
            });

            actionBtn.setVisible(near && !isModalOpen);
        }

        function openModal(loc) {
            document.getElementById('modal-title').innerText = loc.title;
            document.getElementById('modal-desc').innerText = loc.desc;
            document.getElementById('memory-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('memory-modal').style.display = 'none';
        }

        // --- GERADOR DE ARTES VETORIAIS VIA CANVAS ---
        function generateVectorAssets(scene) {
            // 1. Textura do Gramado
            let g = scene.make.graphics({width: 128, height: 128, add: false});
            g.fillStyle(0x4ade80, 1); g.fillRect(0, 0, 128, 128);
            g.fillStyle(0x22c55e, 0.4);
            g.fillCircle(30, 30, 20); g.fillCircle(90, 80, 25);
            g.generateTexture('grass_tile', 128, 128);

            // 2. Árvore Estilizada (Camadas)
            let t = scene.make.graphics({width: 120, height: 140, add: false});
            t.fillStyle(0x15803d, 1); t.fillCircle(60, 60, 50); // Copa Base
            t.fillStyle(0x22c55e, 1); t.fillCircle(55, 50, 42); // Copa do Meio
            t.fillStyle(0x86efac, 1); t.fillCircle(45, 38, 25); // Brilho Superior
            t.lineStyle(4, 0x14532d, 1); t.strokeCircle(60, 60, 50);
            t.generateTexture('vector_tree', 120, 140);

            // 3. Flores (3 Cores)
            const colors = [0xf43f5e, 0xfbbf24, 0xa855f7];
            colors.forEach((color, idx) => {
                let fl = scene.make.graphics({width: 20, height: 20, add: false});
                fl.fillStyle(color, 1); fl.fillCircle(10, 10, 6);
                fl.fillStyle(0xffffff, 1); fl.fillCircle(10, 10, 2);
                fl.generateTexture('flower_' + (idx + 1), 20, 20);
            });

            // 4. Personagem Estilizado
            let p = scene.make.graphics({width: 50, height: 50, add: false});
            p.fillStyle(0xef476f, 1); p.fillCircle(25, 25, 18); // Corpo
            p.lineStyle(3, 0x1e1b4b, 1); p.strokeCircle(25, 25, 18); // Contorno
            p.fillStyle(0xffd166, 1); p.fillCircle(25, 16, 12); // Cabeça/Cabelo
            p.fillStyle(0x1e1b4b, 1); p.fillCircle(20, 14, 2.5); p.fillCircle(30, 14, 2.5); // Olhos
            p.generateTexture('character_sprite', 50, 50);
        }
    </script>
</body>
</html>
